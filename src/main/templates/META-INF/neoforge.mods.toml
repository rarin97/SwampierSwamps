modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL="https://github.com/andrew0030/SwampierSwamps/issues"
logoFile="logo.png"
license="GNU Lesser General Public License v3.0"

[[mods]] #mandatory
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/swampier-swamps"
credits=""
authors="andrew0030"
description='''Swampier Swamps is a Mod that aims to overhaul and improve the Swamp Biome and some of the features added in the Wild Update.'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "${neo_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
